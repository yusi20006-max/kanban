name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start preview
        run: npm run preview -- --host 127.0.0.1 > /tmp/kanban-preview.log 2>&1 &
      - name: Wait for preview
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/health/live >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kanban-preview.log
          exit 1
      - run: npm run production:smoke
      - run: npm run integration:smoke
        env:
          BASE_URL: http://127.0.0.1:8081
      - name: Validate release version contract
        run: RELEASE_TAG="v$(node -p "require('./package.json').version")" npm run release:check
      - name: Preview log on failure
        if: failure()
        run: cat /tmp/kanban-preview.log
