name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start preview
        run: npm run preview > /tmp/kanban-preview.log 2>&1 &
      - run: node scripts/health-check.mjs
        env:
          BASE_URL: http://localhost:8080
      - run: npm run production:smoke
        env:
          BASE_URL: http://localhost:4173
