name: Kanban Provision

on:
  push:
    branches: ["main"]
    paths:
      - "projects/**/board.json"
      - "projects/board.schema.json"
      - "scripts/project-provisioning-*.mjs"
      - "scripts/provision-project.mjs"
      - "migrations/**"
      - ".github/workflows/kanban-provision.yml"
  workflow_dispatch:
    inputs:
      project_config:
        description: "Project configuration path, relative to repository root"
        required: true
        default: "projects/yasin-chess/board.json"
        type: string
      owner_user_id:
        description: "Optional Kanban owner override"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      PROJECT_CONFIG: ${{ inputs.project_config || '' }}
      KANBAN_PROVISION_OWNER: ${{ inputs.owner_user_id || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Resolve project configuration
        shell: bash
        run: |
          set -euo pipefail
          config="$PROJECT_CONFIG"
          if [ -z "$config" ]; then
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo "project_config is required for non-push runs." >&2
              exit 1
            fi
            mapfile -t configs < <(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" -- "projects/*/board.json")
            if [ "${#configs[@]}" -ne 1 ]; then
              echo "Push provisioning requires exactly one changed project config." >&2
              printf "%s\n" "${configs[@]}" >&2
              exit 1
            fi
            config="${configs[0]}"
          fi
          case "$config" in
            projects/*/board.json) ;;
            *) echo "Invalid project_config: $config" >&2; exit 1 ;;
          esac
          test -f "$config"
          echo "PROJECT_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Capture reference repository before provisioning
        env:
          REFERENCE_REPOSITORY: yusi20006-max/yasin-chess
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REFERENCE_REPOSITORY" > reference-repository-before.json
      - name: Provision and verify twice
        run: node scripts/provision-project.mjs "$PROJECT_CONFIG" | tee provision-result.json
      - name: Verify rollout acceptance
        run: node scripts/verify-provisioning-rollout.mjs provision-result.json
      - name: Verify reference repository was untouched
        if: always()
        env:
          REFERENCE_REPOSITORY: yusi20006-max/yasin-chess
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$REFERENCE_REPOSITORY" > reference-repository-after.json
          node - <<'NODE'
          const fs = require("node:fs");
          const before = JSON.parse(fs.readFileSync("reference-repository-before.json", "utf8"));
          const after = JSON.parse(fs.readFileSync("reference-repository-after.json", "utf8"));
          if (before.default_branch !== after.default_branch || before.pushed_at !== after.pushed_at) {
            throw new Error("Reference repository changed during provisioning");
          }
          console.log("Reference repository unchanged: yusi20006-max/yasin-chess");
          NODE
      - name: Publish result to job summary
        if: always()
        run: |
          echo "## Kanban Provision" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Configuration: $PROJECT_CONFIG" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -f provision-result.json ]; then cat provision-result.json >> "$GITHUB_STEP_SUMMARY"; else echo "Provisioning did not produce a result file." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Quality checks
        run: |
          npm run typecheck
          npm run lint
          npm test
