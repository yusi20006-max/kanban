name: Kanban Provision

on:
  push:
    branches: ["main"]
    paths:
      - "projects/**/board.json"
      - "projects/board.schema.json"
  workflow_dispatch:
    inputs:
      project_config:
        description: "Project configuration path, relative to repository root"
        required: true
        type: string
      owner_user_id:
        description: "Optional Kanban owner override"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      PROJECT_CONFIG: ${{ inputs.project_config || '' }}
      KANBAN_PROVISION_OWNER: ${{ inputs.owner_user_id || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_EVENT_BEFORE: ${{ github.event.before || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Resolve project configuration
        shell: bash
        run: |
          set -euo pipefail
          config="$PROJECT_CONFIG"
          if [ -z "$config" ]; then
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo "project_config is required for non-push runs." >&2
              exit 1
            fi
            mapfile -t configs < <(
              node --input-type=module -e '
                const headers = {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2026-03-10"
                };
                const repo = process.env.GITHUB_REPOSITORY;
                const before = process.env.GITHUB_EVENT_BEFORE;
                const sha = process.env.GITHUB_SHA;
                const urls = [
                  `https://api.github.com/repos/${repo}/compare/${before}...${sha}`,
                  `https://api.github.com/repos/${repo}/commits/${sha}`
                ];
                const paths = new Set();
                for (const url of urls) {
                  const response = await fetch(url, { headers });
                  if (!response.ok) throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
                  const payload = await response.json();
                  for (const file of payload.files ?? []) {
                    if (/^projects\/[^/]+\/board\\.json$/.test(file.filename)) paths.add(file.filename);
                  }
                  if (paths.size > 0) break;
                }
                for (const path of paths) console.log(path);
              '
            )
            if [ "${#configs[@]}" -ne 1 ]; then
              echo "Push provisioning requires exactly one changed project config." >&2
              printf "%s\n" "${configs[@]}" >&2
              exit 1
            fi
            config="${configs[0]}"
          fi
          case "$config" in
            projects/*/board.json) ;;
            *) echo "Invalid project_config: $config" >&2; exit 1 ;;
          esac
          test -f "$config"
          echo "PROJECT_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Resolve referenced repository
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const config = JSON.parse(await readFile(process.env.PROJECT_CONFIG, "utf8"));
            if (!config.project?.repository) throw new Error("Project configuration has no project.repository");
            console.log("Configured repository:", config.project.repository);
            console.log("REFERENCE_REPOSITORY=" + config.project.repository);
          ' | tee repository-resolution.txt
          grep '^REFERENCE_REPOSITORY=' repository-resolution.txt >> "$GITHUB_ENV"
      - name: Capture referenced repository before provisioning
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/$REFERENCE_REPOSITORY" > reference-repository-before.json
      - name: Provision and verify
        run: node scripts/provision-project.mjs "$PROJECT_CONFIG" | tee provision-result.json
      - name: Verify rollout acceptance
        run: node scripts/verify-provisioning-rollout.mjs provision-result.json "$PROJECT_CONFIG"
      - name: Verify referenced repository was untouched
        if: ${{ always() && env.REFERENCE_REPOSITORY != '' && hashFiles('reference-repository-before.json') != '' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/$REFERENCE_REPOSITORY" > reference-repository-after.json
          node - <<'NODE'
          const fs = require("node:fs");
          const before = JSON.parse(fs.readFileSync("reference-repository-before.json", "utf8"));
          const after = JSON.parse(fs.readFileSync("reference-repository-after.json", "utf8"));
          if (before.default_branch !== after.default_branch || before.pushed_at !== after.pushed_at) {
            throw new Error("Referenced repository changed during provisioning");
          }
          console.log("Referenced repository unchanged:", before.full_name);
          NODE
      - name: Publish result to job summary
        if: always()
        run: |
          echo "## Kanban Provision" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Configuration: $PROJECT_CONFIG" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -f provision-result.json ]; then cat provision-result.json >> "$GITHUB_STEP_SUMMARY"; else echo "Provisioning did not produce a result file." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Quality checks
        run: |
          npm run typecheck
          npm run lint
          npm test
