name: Kanban Provision

on:
  workflow_dispatch:
    inputs:
      owner_user_id:
        description: "Kanban owner user id"
        required: false
        default: "dev-user"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      KANBAN_PROVISION_OWNER: ${{ inputs.owner_user_id }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision and verify twice
        run: node scripts/provision-yasin-chess.mjs | tee provision-result.json

      - name: Publish result to job summary
        if: always()
        run: |
          echo "## Kanban Provision — Yasin Chess" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f provision-result.json ]; then
            cat provision-result.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Provisioning did not produce a result file." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment verification result on Issue #159
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f provision-result.json ]; then
            {
              echo "### Kanban Provision verification"
              echo ""
              echo "Workflow: ${{ github.workflow }}"
              echo "Run: ${{ github.run_id }}"
              echo ""
              cat provision-result.json
            } > issue-159-comment.md
          else
            {
              echo "### Kanban Provision verification"
              echo ""
              echo "Workflow ${{ github.run_id }} failed before producing a provisioning result."
            } > issue-159-comment.md
          fi
          gh issue comment 159 --repo "${{ github.repository }}" --body-file issue-159-comment.md

      - name: Quality checks
        run: |
          npm run typecheck
          npm run lint
          npm test
